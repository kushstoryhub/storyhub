<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryHub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#ff9800;
padding:18px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.search{
padding:20px;
text-align:center;
}

.search input{
width:90%;
max-width:450px;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#1f1f1f;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(255,255,255,.1);
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.card h2{
color:#ff9800;
margin-bottom:10px;
}

.card p{
color:#ddd;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
background:#ff9800;
border:none;
border-radius:8px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

footer{
text-align:center;
padding:20px;
color:#aaa;
}
</style>
</head>

<body>

<header>
📚 StoryHub
</header>

<div class="search">
<input type="text" placeholder="Search Stories...">
</div>

<div class="container">

<div class="card">
<h2>Horror Story</h2>
<p>Read a scary horror story. Unlock the full story for only ₹1.</p>
<button>Pay ₹1 & Read</button>
</div>

<div class="card">
<h2>Love Story</h2>
<p>A beautiful romantic story waiting for you.</p>
<button>Pay ₹1 & Read</button>
</div>

<div class="card">
<h2>Mystery Story</h2>
<p>Can you solve the mystery? Read now.</p>
<button>Pay ₹1 & Read</button>
</div>

<div class="card">
<h2>Motivation</h2>
<p>Powerful motivational stories to inspire you.</p>
<button>Read Free</button>
</div>

</div>

<footer>
© 2026 StoryHub | Made with ❤️
</footer>

</body>
</html>

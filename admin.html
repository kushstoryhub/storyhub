<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KushComics Admin Panel</title>

<link rel="stylesheet" href="admin.css">

</head>
<body>

<header class="topbar">

<h1>🛡 KushComics Admin Panel</h1>

<p>Upload and Manage Comics</p>

</header><main class="admin-container">

<div class="card">

<h2>📚 Add New Comic</h2>

<label>Comic Title</label>
<input type="text" placeholder="Enter comic title">

<label>Category</label>
<select>
<option>Action</option>
<option>Adventure</option>
<option>Fantasy</option>
<option>Horror</option>
<option>Romance</option>
</select>

<label>Cover Image</label>
<input type="file" accept="image/*">

<label>Comic PDF / ZIP</label>
<input type="file" accept=".pdf,.zip">

</div><div class="card">

<h2>💎 Comic Settings</h2>

<label>Comic Type</label>

<select>

<option>Free</option>

<option>Premium</option>

</select>

<label>Description</label>

<textarea placeholder="Write comic description..." rows="6"></textarea>

<button id="publishBtn">🚀 Publish Comic</button>

</div>

</main>

<script src="admin.js"></script>

</body>
</html>
